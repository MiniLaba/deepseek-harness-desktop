name: Build desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish without rebuilding
        required: true
        type: string
      source_run_id:
        description: Workflow run containing the build artifacts
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arguments: --mac --x64
            artifact: macos-intel
          - os: macos-14
            arguments: --mac --arm64
            artifact: macos-apple-silicon
          - os: windows-latest
            arguments: --win --x64
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.arguments }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: gh release create "${RELEASE_TAG}" release/* --generate-notes --title "DeepSeek Harness Desktop ${RELEASE_TAG}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
